name: CI
on:
  push: { branches: [ main, develop, 'feature/**' ] }
  pull_request: { branches: [ main, develop ] }
jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: '16.4' }
      - name: Create Config.xcconfig from secret
        run: |
          mkdir -p Resources
          echo "API_KEY = ${{ secrets.ODDS_API_KEY }}" > Resources/Config.xcconfig
      - name: Create GoogleService-Info.plist from secret
        run: echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}" | base64 --decode > OddsArbitrage/GoogleService-Info.plist
      - name: Create TestCredentials.swift from secrets
        run: |
          cat > OddsArbitrageUITests/TestCredentials.swift << EOF
          enum TestCredentials {
              static let email = "${{ secrets.UITEST_EMAIL }}"
              static let password = "${{ secrets.UITEST_PASSWORD }}"
          }
          EOF
      - name: Build and test
        run: |
          xcodebuild test -project OddsArbitrage.xcodeproj -scheme OddsArbitrage \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -resultBundlePath TestResults.xcresult \
            -skipMacroValidation CODE_SIGNING_ALLOWED=NO
      - name: DEBUG - dump failure details from xcresult
        if: failure()
        run: xcrun xcresulttool get test-results summary --path TestResults.xcresult
