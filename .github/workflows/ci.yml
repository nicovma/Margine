name: CI
on:
  push: { branches: [ main, develop, 'feature/**' ] }
  pull_request: { branches: [ main, develop ] }
jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: '16.4' }
      - name: Create Config.xcconfig from secret
        run: |
          mkdir -p Resources
          echo "API_KEY = ${{ secrets.ODDS_API_KEY }}" > Resources/Config.xcconfig
      - name: Create GoogleService-Info.plist from secret
        run: echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}" | base64 --decode > Margine/GoogleService-Info.plist
      - name: Create TestCredentials.swift from secrets
        run: |
          cat > MargineUITests/TestCredentials.swift << EOF
          enum TestCredentials {
              static let email = "${{ secrets.UITEST_EMAIL }}"
              static let password = "${{ secrets.UITEST_PASSWORD }}"
          }
          EOF
      - name: Build and test
        run: |
          # Ad-hoc signing (no team/profile) instead of CODE_SIGNING_ALLOWED=NO:
          # FirebaseAuth persists the session to the Keychain, which requires the
          # Keychain Sharing entitlement to actually be embedded in the binary —
          # an unsigned build can't do that and every Firebase sign-in fails with
          # "SecItemAdd (-34018)". Ad-hoc signing embeds entitlements without
          # needing a real certificate/team, which Simulator doesn't require anyway.
          # -testLanguage/-testRegion: los tests assertan contra los literales en
          # español del string catalog (source language). El runner de GitHub
          # Actions arranca el simulador en inglés por defecto, así que
          # String(localized:) resolvía a la traducción en inglés y rompía
          # AuthViewModelTests. Fijamos es_ES para no depender del locale del runner.
          xcodebuild test -project Margine.xcodeproj -scheme Margine \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -resultBundlePath TestResults.xcresult \
            -skipMacroValidation \
            -testLanguage es -testRegion ES \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" PROVISIONING_PROFILE_SPECIFIER=""
      - name: DEBUG - dump failure details from xcresult
        if: failure()
        run: xcrun xcresulttool get test-results summary --path TestResults.xcresult
