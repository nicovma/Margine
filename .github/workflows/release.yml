name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: '26.0.1' }

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Create Config.xcconfig from secret
        run: |
          mkdir -p Resources
          echo "${{ secrets.CONFIG_XCCONFIG_BASE64 }}" | base64 --decode > Resources/Config.xcconfig

      - name: Create GoogleService-Info-Prod.plist from secret
        run: echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}" | base64 --decode > Margine/GoogleService-Info-Prod.plist

      - name: Decode signing certificate
        run: echo "${{ secrets.DISTRIBUTION_CERTIFICATE_P12_BASE64 }}" | base64 --decode > certificate.p12

      - name: Decode provisioning profile
        run: echo "${{ secrets.PROVISIONING_PROFILE_BASE64 }}" | base64 --decode > profile.mobileprovision

      - name: Build and upload to TestFlight
        env:
          CI: true
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT_BASE64 }}
          CERTIFICATE_PATH: certificate.p12
          CERTIFICATE_PASSWORD: ${{ secrets.DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_PATH: profile.mobileprovision
          PROVISIONING_PROFILE_NAME: ${{ secrets.PROVISIONING_PROFILE_NAME }}
        run: bundle exec fastlane beta
